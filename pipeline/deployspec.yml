#
# deployspec.yml
#

version: 0.2

env:
  variables:
    deploy_bucket: api-gateway-lambda-deploy
    deploy_payload: deployment.zip

phases:
  install:
    runtime-versions:
      nodejs: 20
#    commands:

#  pre_build:
#    commands:

  build:
    commands:
      #
      # libcal-Hours function
      - aws lambda update-function-code --function-name libcalhours --s3-bucket ${deploy_bucket} --s3-key latest/libcal-Hours/${deploy_payload}
      #
      # rmc-libauth-canon-c100 function
      - aws lambda update-function-code --function-name uva-rmc-libauth-canon-c100-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-canon-c100/${deploy_payload}
      #
      # rmc-libauth-canon-c200 function
      - aws lambda update-function-code --function-name uva-rmc-libauth-canon-c200-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-canon-c200/${deploy_payload}
      #
      # rmc-libauth-canon-fx300 function
      - aws lambda update-function-code --function-name uva-rmc-libauth-canon-fx300-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-canon-fx300/${deploy_payload}
      #
      # rmc-libauth-canon-rp function
      - aws lambda update-function-code --function-name uva-rmc-libauth-canon-rp-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-canon-rp/${deploy_payload}
      #
      # rmc-libauth-dml-film-scan function
      - aws lambda update-function-code --function-name uva-rmc-libauth-dml-film-scan-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-dml-film-scan/${deploy_payload}
      #
      # rmc-libauth-light-kit function
      - aws lambda update-function-code --function-name uva-rmc-libauth-light-kit-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-light-kit/${deploy_payload}
      #
      # rmc-libauth-photo-anim-studio function
      - aws lambda update-function-code --function-name uva-rmc-libauth-photo-anim-studio-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-photo-anim-studio/${deploy_payload}
      #
      # rmc-libauth-portable-pa function
      - aws lambda update-function-code --function-name uva-rmc-libauth-portable-pa-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-portable-pa/${deploy_payload}
      #
      # rmc-libauth-prt-3d-makerbot function
      - aws lambda update-function-code --function-name uva-rmc-libauth-prt-3d-makerbot-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-prt-3d-makerbot/${deploy_payload}
      #
      # rmc-libauth-prt-3d-taz6 function
      - aws lambda update-function-code --function-name uva-rmc-libauth-prt-3d-taz6-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-prt-3d-taz6/${deploy_payload}
      #
      # rmc-libauth-prt-3d-ultimaker3 function
      - aws lambda update-function-code --function-name uva-rmc-libauth-prt-3d-ultimaker3-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-prt-3d-ultimaker3/${deploy_payload}
      #
      # rmc-libauth-prt-3d-ultimaker5 function
      - aws lambda update-function-code --function-name uva-rmc-libauth-prt-3d-ultimaker5-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-prt-3d-ultimaker5/${deploy_payload}
      #
      # rmc-libauth-video-studio function
      - aws lambda update-function-code --function-name uva-rmc-libauth-video-studio-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-video-studio/${deploy_payload}
      #
      # rmc-libauth-wireless-lav function
      - aws lambda update-function-code --function-name uva-rmc-libauth-wireless-lav-production --s3-bucket ${deploy_bucket} --s3-key latest/rmc-libauth-wireless-lav/${deploy_payload}
      #
      # purchaserequestsubmit function
      - aws lambda update-function-code --function-name purchaserequestsubmit --s3-bucket ${deploy_bucket} --s3-key latest/purchaserequestsubmit/${deploy_payload}
      #
      # scclassinstructionsubmit function
      - aws lambda update-function-code --function-name scclassinstructionsubmit --s3-bucket ${deploy_bucket} --s3-key latest/scclassinstructionsubmit/${deploy_payload}
      #
      # spaceeventsjson function
      - aws lambda update-function-code --function-name eventsjson --s3-bucket ${deploy_bucket} --s3-key latest/spaceeventsjson/${deploy_payload}
      #
      # staffpurchasesubmit function
      - aws lambda update-function-code --function-name staffpurchasesubmit --s3-bucket ${deploy_bucket} --s3-key latest/staffpurchasesubmit/${deploy_payload}
      #
      # totaladvisinglibcalspaceevents function
      - aws lambda update-function-code --function-name totalAdvisingLibcalSpaceEvents --s3-bucket ${deploy_bucket} --s3-key latest/totaladvisinglibcalspaceevents/${deploy_payload}
      #
      # video-clip-form-email function
      - aws lambda update-function-code --function-name video-clip-form-email --s3-bucket ${deploy_bucket} --s3-key latest/video-clip-form-email/${deploy_payload}


